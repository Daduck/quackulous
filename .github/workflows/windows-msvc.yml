name: windows-msvc

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP\vcpkg") {
            Remove-Item -Path "$env:RUNNER_TEMP\vcpkg" -Recurse -Force
          }
          git clone https://github.com/microsoft/vcpkg $env:RUNNER_TEMP\vcpkg
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install sdl2:x64-windows openal-soft:x64-windows
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/windows-msvc -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DQUACK_BUILD_RENDERER_OPENGL2=OFF

      - name: Build Debug
        shell: pwsh
        run: cmake --build build/windows-msvc --config Debug

      - name: Build Release
        shell: pwsh
        run: cmake --build build/windows-msvc --config Release

      - name: Smoke tests
        shell: pwsh
        run: ctest --test-dir build/windows-msvc --build-config Debug --output-on-failure -L smoke
